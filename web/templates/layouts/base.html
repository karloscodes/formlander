{{ define "layouts/base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .Title }}{{ .Title }} · Formlander{{ else }}Formlander{{ end }}</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/assets/app.built.css?v={{ assetVersion }}">
</head>

<body hx-boost="true" class="flex min-h-screen flex-col bg-stone-100 text-stone-900 antialiased">
    <div id="page-loader"></div>

    <header class="border-b border-stone-200 bg-white">
        <div class="mx-auto flex w-full max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3 sm:px-6">
            <a href="/admin" class="flex items-center gap-2 text-base font-semibold tracking-tight">
                <img src="/assets/favicon.svg" alt="" width="24" height="24" class="h-6 w-6">
                Formlander
            </a>
            {{ if not .HideHeaderActions }}
            <nav class="order-last flex w-full items-center gap-1 text-sm sm:order-none sm:w-auto" aria-label="Main">
                <a href="/admin/forms" class="rounded-lg px-3 py-1.5 font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900">Forms</a>
                <a href="/admin/submissions" class="rounded-lg px-3 py-1.5 font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900">Submissions</a>
                <a href="/admin/settings" class="rounded-lg px-3 py-1.5 font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900">Settings</a>
            </nav>
            <form action="/admin/logout" method="post" class="ml-auto">
                <button type="submit" class="rounded-lg px-3 py-1.5 text-sm font-medium text-stone-500 hover:bg-stone-100 hover:text-stone-900">Sign out</button>
            </form>
            {{ end }}
        </div>
    </header>
    <main class="mx-auto w-full max-w-5xl flex-1 space-y-8 px-4 py-8 sm:px-6 sm:py-10">
        {{ if .ContentView }}
        {{ render .ContentView . }}
        {{ end }}
    </main>
    <footer class="py-6 text-center text-xs text-stone-400">
        Formlander, by <a href="https://x.com/karloscodes" target="_blank" rel="noopener" class="hover:text-stone-600">@karloscodes</a>
    </footer>
    <script src="/assets/vendor/htmx.min.js?v={{ assetVersion }}"></script>
    <script>
        // A thin bar at the top while a page loads.
        document.body.addEventListener('htmx:beforeRequest', function () {
            document.getElementById('page-loader').style.opacity = '1';
        });
        document.body.addEventListener('htmx:afterRequest', function () {
            setTimeout(function () { document.getElementById('page-loader').style.opacity = '0'; }, 300);
        });
    </script>
</body>

</html>
{{ end }}
