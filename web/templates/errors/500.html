{{/* The page for an error: 404, 500, and the others. */}}
{{ define "errors/500/content" }}
<div class="mx-auto max-w-md py-16 text-center">
    <p class="font-mono text-sm text-stone-500">{{ .Code }}</p>
    <h1 class="mt-2 text-2xl font-semibold tracking-tight text-stone-900">{{ .Heading }}</h1>
    <p class="mt-2 text-sm text-stone-600">{{ .Message }}</p>
    <div class="mt-8 flex justify-center gap-3">
        <a href="javascript:history.back()" class="btn">Go back</a>
        <a href="/admin" class="btn-primary">Dashboard</a>
    </div>
    {{ if .ErrorMessage }}
    <pre class="mono mt-8 whitespace-pre-wrap break-words rounded-xl bg-white p-4 text-left text-stone-700 ring-1 ring-stone-900/5">{{ .ErrorMessage }}</pre>
    {{ end }}
</div>
{{ end }}
