name: Release

on:
  push:
    tags:
      - 'v*'
  # Release candidate starts it for a tag it pushed: see release-candidate.yml.
  # A tag whose own workflow is older than this file is published from main:
  #   gh workflow run Release --ref main -f tag=v3.8.0
  # The first job resolves that tag to one commit. Later jobs check that
  # commit out, and GoReleaser is pinned to the tag name.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v3.8.0. Empty: the tag this run was started on."
        required: false
        type: string

# Each job asks for what it needs. Only the job that publishes can write.
permissions:
  contents: read

jobs:
  tag:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release tag
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release runs on vX.Y.Z or vX.Y.Z-rc.N, got: ${tag}" >&2
            exit 1
          fi
          # refs/tags/ only. A branch named vX.Y.Z must not pass.
          tagged="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # The image tags have no v: karloscodes/formlander:3.8.0.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=${tagged}" >> "$GITHUB_OUTPUT"

          # An rc: GoReleaser finds the previous tag itself.
          if [[ "$tag" == *-* ]]; then
            exit 0
          fi

          # The list holds this tag, so any other highest tag is above it.
          stables="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          highest="$(printf '%s\n' "$stables" | head -1)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$tag" != "$highest" ]; then
            echo "Refusing ${tag}: ${highest} is the newest stable tag, and ${tag} would move latest back." >&2
            exit 1
          fi
          previous="$(printf '%s\n' "$stables" | awk -v cur="$tag" '$0 == cur { found = 1; next } found { print; exit }')"
          if [ -z "$previous" ]; then
            echo "No stable tag before ${tag}." >&2
            exit 1
          fi
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: Run tests
        run: make test

  # The install paths with Chasen: see chasen.yml. The commit the tag job
  # resolved, not the ref this workflow was started on.
  chasen:
    needs: tag
    uses: ./.github/workflows/chasen.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}

  goreleaser:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    needs: [tag, test, chasen]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The installed Go must be the go line in go.mod, and the image tag
      # must name that same release. A future toolchain line must be kept
      # in sync: setup-go installs it instead of the go line.
      - name: Check the release Go
        run: |
          set -euo pipefail
          mod="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          got="$(go env GOVERSION)"
          if [ -z "${mod}" ] || [ -z "${got}" ] || [ "${got}" != "go${mod}" ]; then
            echo "go env GOVERSION is '${got:-}', want go${mod:-}"
            exit 1
          fi
          tag="$(awk '$1 == "FROM" && $2 ~ /^golang:/ { sub(/^golang:/, "", $2); print $2; exit }' Dockerfile)"
          ver="${tag%%-*}"
          if [ -z "${ver}" ] || [ "${ver}" != "${mod}" ]; then
            echo "Dockerfile FROM golang:${tag:-} does not match go ${mod}"
            exit 1
          fi
          echo "Release Go is ${got}; image is golang:${tag}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: karloscodes
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # local: use the toolchain setup-go installed. A newer line in go.mod
      # must fail this step, not download another toolchain.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOTOOLCHAIN: local
          # Pin the tag. GoReleaser's default sort (-version:refname) lists
          # v3.8.0-rc.4 ahead of v3.8.0 when both point at HEAD, and
          # prerelease: auto then follows that rc tag. Stable notes start at
          # the previous stable tag, not at the rc that shares this commit.
          GORELEASER_CURRENT_TAG: ${{ needs.tag.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.tag.outputs.previous }}

      - name: Release summary
        run: |
          echo "## 🚀 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release: https://github.com/karloscodes/formlander/releases/tag/${{ needs.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Hub: https://hub.docker.com/r/karloscodes/formlander" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Tags Published" >> $GITHUB_STEP_SUMMARY
          echo "- \`karloscodes/formlander:${{ needs.tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- A stable release also moves \`latest\`, \`v<major>\`, and \`v<major>.<minor>\`. A release candidate does not." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64" >> $GITHUB_STEP_SUMMARY

  # The scan runs third-party code, so it gets its own job with no Docker Hub
  # login and no write access. The image is public, so it needs neither.
  scan:
    name: Scan the release image
    runs-on: ubuntu-latest
    needs: [tag, goreleaser]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'karloscodes/formlander:${{ needs.tag.outputs.version }}'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
        continue-on-error: true

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-docker-results.sarif'
        continue-on-error: true
